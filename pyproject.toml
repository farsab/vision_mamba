
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mvg-basics"
version = "0.1.0"
description = "Minimal multi-view geometry / SfM / SLAM building blocks"
authors = [{name="You"}]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
